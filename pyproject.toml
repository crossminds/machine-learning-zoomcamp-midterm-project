[project]
name = "credit-card-fraud-detection"
version = "0.1.0"
description = "Credit card fraud detection model served as a FastAPI web service (ML Zoomcamp project)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Runtime dependencies: everything needed to train the model and serve it.
dependencies = [
    "fastapi",
    "numpy",
    "pandas",
    "scikit-learn",
    "uvicorn",
    "xgboost",
]

[dependency-groups]
# Notebook, plotting, the test client and tests - not installed in the Docker image.
dev = [
    "httpx",
    "jupyter",
    "matplotlib",
    "nbconvert",
    "pytest",
    "requests",
    "seaborn",
]

[tool.uv]
package = false
